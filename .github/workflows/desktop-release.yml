name: Publish desktop release

on:
  push:
    branches:
      - main
    paths:
      - "desktop-companion/**"
      - "assets/**"
      - "Font/**"
      - "english_definitions/**"
      - "Design pictures/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

concurrency:
  group: desktop-release-main
  cancel-in-progress: true

jobs:
  publish-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: macOS universal installer
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            cache_key: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64 installer
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            cache_key: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-companion/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-companion/src-tauri
          key: ${{ matrix.cache_key }}

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-companion

      - name: Prepare automatic release version
        run: npm run prepare:ci-release
        working-directory: desktop-companion

      - name: Verify release version
        run: npm run verify:release
        working-directory: desktop-companion

      - name: Run native tests
        run: npm run test:rust
        working-directory: desktop-companion

      - name: Verify updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be configured as repository secrets."
            exit 1
          fi

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop-companion
          tagName: desktop-v__VERSION__
          releaseName: Dzongkha Dictionary Desktop v__VERSION__
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: ${{ matrix.args }}

  publish-release:
    name: Publish completed release
    needs: publish-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve automatic release version
        id: release
        shell: bash
        run: node -e "const p=require('./manifest.json').version.split('.'); console.log('version='+p.slice(0,2).join('.')+'.'+process.env.GITHUB_RUN_NUMBER)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "desktop-v${{ steps.release.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
