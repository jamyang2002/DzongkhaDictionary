name: Build Windows desktop installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop-companion/**"
      - "assets/**"
      - "Font/**"
      - "english_definitions/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - ".github/workflows/desktop-windows.yml"
jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-companion

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-companion/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-companion/src-tauri

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run native tests
        run: npm run test:rust

      - name: Build NSIS installer
        run: npm run build:windows:ci

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dzongkha-dictionary-windows-x64
          if-no-files-found: error
          path: desktop-companion/src-tauri/target/release/bundle/nsis/*.exe
