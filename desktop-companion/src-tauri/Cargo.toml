[package]
name = "dzongkha-dictionary-desktop"
version = "3.6.0"
description = "Native desktop companion for Dzongkha Dictionary Quick Lookup"
authors = ["Dzongkha Dictionary"]
edition = "2021"

[lib]
name = "dzongkha_dictionary_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipboard-rs = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow"] }
